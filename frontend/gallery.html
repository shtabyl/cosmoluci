<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/script.js" defer></script>
    <script src="js/filter.js" defer></script>
    <script type="module" src="js/gallery.js" defer></script>
    
    <title>Светлана Осипова</title>
</head>
<body>
    <header class="header">

        <div class="header__container content-grid">
            
            <div class="header__navbar full-width">
                
                <div class="navbar__burger burger">
                    <span></span><span></span><span></span>
                </div>
                
                <nav class="navbar">
                    <div class="header__logo logo">
                        <a href="index.html" class="logo_header link link_logo">Светлана Осипова</a>
                    </div>
                    <div class="navbar__menu-list">
                        <ul>
                            <li class="navbar__menu-item link link_header link-active"><a href="gallery.html">Галерея</a></li>
                            <li class="navbar__menu-item link link_header"><a href="about.html">Обо мне</a></li>
                            <!-- <li class="navbar__menu-item link link_header"><a href="blog.html">Блог</a></li> -->
                            <li class="navbar__menu-item link link_header"><a href="contacts.html">Контакты</a></li>
                        </ul>
                    </div>
                    <div class="navbar__social social">
                        <ul class="navbar__social-item-list">
                            <!-- <li class="social__item">
                                <a href="#">
                                    <img src="./assets/icons/telegram.svg" alt="Telegram">
                                </a>
                            </li> -->
                            <!-- <li class="social__item">
                                <a href="#">
                                    <img src="./assets/icons/instagram.svg" alt="Instagram">
                                </a>
                            </li> -->
                            <li class="social__item vkontakte">
                                <a href="https://vk.com/sveta.cosmoluci">
                                    <img src="assets/icons/vk.svg" alt="VK">
                                </a>
                            </li>
                        </ul>
                    </div>
                </nav>

            </div>

            <div class="header__hero-wrapper">
            </div>
        </div>
    </header>

    <main class="main">
        <div class="main__container content-grid">
            <section class="gallery">
                <div class="gallery__filters filter">
                    <button class="filter-button button button-active" data-type="all">Все работы</button>
                    <button class="filter-button button" data-type="portrait">Портреты</button>
                    <button class="filter-button button" data-type="landscape">Пейзажи</button>
                    <button class="filter-button button" data-type="still-life">Натюрморты</button>
                    <button class="filter-button button" data-type="abstract">Абстракция</button>
                    <button class="filter-button button" data-type="copies">Копии</button>
                    <div class="select-container">
                        <div class="select-native-wrapper">
                            <select class="select-native js-selectNativefilter-select" name="year" id="year-filter">
                                <option value="all" selected>Год</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                            </select>
                        </div>
                        <div class="select-custom-wrapper">
                            <div class="select-custom js-selectCustom" aria-hidden="true">
                                <div class="select-custom-trigger">Год</div>
                                <div class="select-custom-options">
                                    <div class="select-custom-option active_select" data-value="all">Все</div>
                                    <div class="select-custom-option" data-value="2022">2022</div>
                                    <div class="select-custom-option" data-value="2021">2021</div>
                                    <div class="select-custom-option" data-value="2023">2023</div>
                                </div>
                                <img src="assets/icons/chevron-down.svg" class="select-arrow">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gallery -->
                <div id="gallery-container" class="gallery__pictures">
                    <a href="artwork.html?picture=landscape-2023" class="gallery__picture-link">
                        <picture class="gallery__picture picture picture_gallery" data-type="landscape" data-year="2023">
                            <source media="(min-width: 1200px)" srcset="img/landscape-2023.jpg">
                            <img src="img/landscape-2023.jpg" loading="lazy" alt="Landscape 2023">
                        </picture>
                    </a>
                    <a href="artwork.html?picture=portrait-2022" class="gallery__picture-link">
                        <picture class="gallery__picture picture picture_gallery" data-type="portrait" data-year="2022">
                            <source media="(min-width: 1200px)" srcset="img/portrait-2022.jpg">
                            <img src="img/portrait-2022.jpg" loading="lazy" alt="Portrait 2022">
                        </picture>
                    </a>
                    <a href="artwork.html?picture=abstract-2021" class="gallery__picture-link">
                        <picture class="gallery__picture picture picture_gallery" data-type="abstract" data-year="2021">
                            <source media="(min-width: 1200px)" srcset="img/abstract-2021.jpg">
                            <img src="img/abstract-2021.jpg" loading="lazy" alt="Abstract 2021">
                        </picture>
                    </a>
                    <a href="artwork.html?picture=still-life-2023" class="gallery__picture-link">
                        <picture class="gallery__picture picture picture_gallery" data-type="still-life" data-year="2023">
                            <source media="(min-width: 1200px)" srcset="img/still-life-2023.jpg">
                            <img src="img/naturmortes-2023.jpg" loading="lazy" alt="Still-life 2023">
                        </picture>
                    </a>
                    <a href="artwork.html?picture=copies-2023" class="gallery__picture-link">
                        <picture class="gallery__picture picture picture_gallery" data-type="copy" data-year="2023">
                            <source media="(min-width: 1200px)" srcset="img/copies-2023.jpg">
                            <img src="img/copies-2023.jpg" loading="lazy" alt="Copies 2023">
                        </picture>
                    </a>
                </div>

            </section>
        </div>
    </main>

    <footer class="footer"></footer>

</body>
</html>
