<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="js/script.js" defer></script>
    <script src="js/filter.js" defer></script>
    <script type="module" src="js/gallery.js" defer></script>
    
    <title>Svetlana Osipova</title>
</head>
<body>
    <header class="header">

        <div class="header__container content-grid">
            
            <div class="header__navbar full-width">
                
                <div class="navbar__burger burger">
                    <span></span><span></span><span></span>
                </div>
                
                <nav class="navbar">
                    <div class="header__logo logo">
                        <a href="index.html" class="logo_header link link_logo">Svetlana Osipova</a>
                    </div>
                    <div class="navbar__menu-list">
                        <ul>
                            <li class="navbar__menu-item link link_header link-active"><a href="gallery.html">Artworks</a></li>
                            <li class="navbar__menu-item link link_header"><a href="about.html">About</a></li>
                            <!-- <li class="navbar__menu-item link link_header"><a href="blog.html">Blog</a></li> -->
                            <li class="navbar__menu-item link link_header"><a href="contacts.html">Contacts</a></li>
                        </ul>
                    </div>
                    <div class="navbar__social social">
                        <ul class="navbar__social-item-list">
                            <!-- <li class="social__item">
                                <a href="#">
                                    <img src="./assets/icons/telegram.svg" alt="Telegram">
                                </a>
                            </li> -->
                            <li class="social__item">
                                <a href="https://www.instagram.com/cosmoluci/" target="_blank" rel="noopener noreferrer">
                                    <img src="./assets/icons/instagram.svg" alt="Instagram">
                                </a>
                            </li>
                            <!-- <li class="social__item vkontakte">
                                <a href="https://vk.com/sveta.cosmoluci" target="_blank" rel="noopener noreferrer">
                                    <img src="assets/icons/vk.svg" alt="VK">
                                </a>
                            </li> -->
                        </ul>
                    </div>
                </nav>

            </div>

            <div class="header__hero-wrapper">
            </div>
        </div>
    </header>

    <main class="main">
        <div class="main__container content-grid">
            <section class="gallery">
                <div class="gallery__filters filter">
                    <button class="filter-button button button-active" data-type="all">All</button>
                    <button class="filter-button button" data-type="portrait">Portraits</button>
                    <button class="filter-button button" data-type="landscape">Lanscapes</button>
                    <button class="filter-button button" data-type="still-life">Still life</button>
                    <button class="filter-button button" data-type="abstract">Abstract</button>
                    <button class="filter-button button" data-type="copies" id="copy-filter">Copies</button>
                    <div class="select-container">
                        <div class="select-native-wrapper">
                            <select class="select-native js-selectNativefilter-select" name="year" id="year-filter">
                                <option value="all" selected>Year</option>

                            </select>
                        </div>
                        <div class="select-custom-wrapper">
                            <div class="select-custom" aria-hidden="true">
                                <div class="select-custom-trigger">Year</div>
                                <div id="year-filter-options" class="select-custom-options">
                                    <div class="select-custom-option active_select" data-value="all">All years</div>

                                </div>
                                <img src="assets/icons/chevron-down.svg" class="select-arrow">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Gallery -->
                <div id="gallery-container" class="gallery__pictures">
                </div>

            </section>
        </div>
    </main>

    <footer class="footer"></footer>

</body>
</html>
