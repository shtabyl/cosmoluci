<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">

    <script type="module" src="./scripts/reference-data.js" defer></script>
    <link rel="stylesheet" href="./styles/admin.css">
    <title>Reference data</title>
</head>

<body>
    <header class="container">
    <nav class="admin-nav">

        <a class="admin-nav__item" href="index.html">
            Artworks
        </a>

        <a id="create-artwork" class="admin-nav__item" href="artwork.html">
            Add artwork
        </a>

        <a class="admin-nav__item" href="reference-data.html">
            Reference data
        </a>

        <button id="logout-button" type="button" class="admin-nav__item button">
            Log out
        </button>

        </nav>
    </header>
    <main class="admin container reference">

        <h1 class="title admin__header">Edit reference data</h1>

        <section class="reference-section">

            <h2 class="subtitle">Mediums</h2>

            <form
                class="reference-form"
                data-reference-type="mediums"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Medium"
                    required
                >

                <button type="submit" class="button">
                    Add
                </button>

            </form>

            <div
                class="reference-list"
                id="mediums-list"
            ></div>

        </section>


        <section class="reference-section">

            <h2 class="subtitle">Surfaces</h2>

            <form
                class="reference-form"
                data-reference-type="surfaces"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Surface"
                    required
                >

                <button type="submit" class="button">
                    Add
                </button>

            </form>

            <div
                class="reference-list"
                id="surfaces-list"
            ></div>

        </section>


        <section class="reference-section">

            <h2 class="subtitle">Statuses</h2>

            <form
                class="reference-form"
                data-reference-type="statuses"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Status"
                    required
                >

                <button type="submit" class="button">
                    Add
                </button>

            </form>

            <div
                class="reference-list"
                id="statuses-list"
            ></div>

        </section>


        <section class="reference-section">

            <h2 class="subtitle">Genres</h2>

            <form
                class="reference-form"
                data-reference-type="genres"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Genre"
                    required
                >

                <button type="submit" class="button">
                    Add
                </button>

            </form>

            <div
                class="reference-list"
                id="genres-list"
            ></div>

        </section>


        <section class="reference-section">

            <h2 class="subtitle">Owners</h2>

            <form id="owner-form" class="owner-form">

                <input
                    type="text"
                    name="country"
                    placeholder="Country"
                    required
                >

                <input
                    type="text"
                    name="owner_type"
                    placeholder="Owner type"
                    value="Private collection"
                    required
                >

                <button type="submit" class="button">
                    Add
                </button>

            </form>

            <div
                class="reference-list"
                id="owners-list"
            ></div>

        </section>

    </main>

</body>

</html>
