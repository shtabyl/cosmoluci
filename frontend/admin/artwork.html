<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/admin.css">
    <script type="module" src="scripts/artwork.js" defer></script>
    <title>Admin painting</title>
</head>
<body>
    <header class="container">
    <nav class="admin-nav">

        <a class="admin-nav__item" href="index.html">
            Картины
        </a>

        <a class="admin-nav__item" href="reference-data.html">
            Справочники
        </a>

        </nav>
    </header>
    <main class="container">

        <header class="admin__header">
            <h1 class="title">Редактирование картины</h1>

            <button class="button">
                <a href="index.html">К списку картин</a>
            </button>
        </header>

        <p>
            ID
            <span id="id"></span>
        </p>

        <form id="artwork-form" class="admin-form">


            <label>
                Название
                <input
                    type="text"
                    id="title"
                    name="title"
                >
            </label>

            <label>
                Год
                <input
                    type="number"
                    id="creation-year"
                    name="creation_year"
                >
            </label>

            <label>
                Описание
                <textarea
                    id="description"
                    name="description"
                ></textarea>
            </label>

            <label>
                Высота, см
                <input
                    type="number"
                    step="0.1"
                    id="height"
                    name="height_cm"
                >
            </label>

            <label>
                Ширина, см
                <input
                    type="number"
                    step="0.1"
                    id="width"
                    name="width_cm"
                >
            </label>

            <label>
                Материал
                <select id="medium" name="medium_id">
                    <option value="">Выберите материал</option>
                </select>
            </label>

            <label>
                Основа
                <select id="surface" name="surface_id">
                    <option value="">Выберите основу</option>
                </select>
            </label>

            <label>
                Статус
                <select id="status" name="status_id">
                    <option value="">Выберите статус</option>
                </select>
            </label>

            <label>
                Владелец
                <select id="owner" name="owner_id">
                    <option value="">Выберите владельца</option>
                </select>
            </label>

            <fieldset class="genres">
                <legend>Жанры</legend>
                <div id="genres" class="genres-list"></div>
            </fieldset>

            <button type="submit" class="button">
                Сохранить
            </button>

        </form>

        <section class="admin-images">

            <h2>Изображения</h2>

            <div id="images-container" class="images-container">
                <!-- изображения будут добавляться через JS -->
            </div>

        </section>

        <section class="admin-image-upload">

            <h3>Добавить изображение</h3>

            <form id="image-upload-form">

                <label>
                    Файл

                    <input
                        type="file"
                        id="image-file"
                        accept="image/jpeg,image/png"
                        required
                    >
                </label>

                <label>
                    Тип изображения

                    <select id="image-type">
                        <option value="main">
                            Главное изображение
                        </option>

                        <option value="detail">
                            Деталь
                        </option>
                    </select>
                </label>

                <button type="submit">
                    Загрузить
                </button>

            </form>

        </section>

    </main>
</body>
</html>
