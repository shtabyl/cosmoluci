<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    
    <link rel="stylesheet" href="styles/admin.css">
    <script type="module" src="scripts/auth.js" defer></script>
    <script type="module" src="scripts/artwork.js" defer></script>
    <title>Admin painting</title>
</head>
<body>
    <header class="container">
    <nav class="admin-nav">

        <a class="admin-nav__item" href="index.html">
            Artworks
        </a>

        <a id="create-artwork" class="admin-nav__item" href="artwork.html">
            Add artwork
        </a>

        <a class="admin-nav__item" href="reference-data.html">
            Reference data
        </a>

        <button id="logout-button" type="button" class="admin-nav__item button button_logout">
            Log out
        </button>

        </nav>
    </header>
    <main class="container">

        <header class="admin__header">
            <h1 class="title">Edit Artwork</h1>
        </header>

        <div class="admin-artwork__start-block" id="id-section">
            <div class="artwork__status">
                <p class="admin-artwork__solid">ID:&nbsp;<span id="id"></span></p>
                <div id="publication-status" class="admin-artwork__publish admin-artwork__solid"></div>
            </div>
            <button id="publication-button" type="button" class="button"></button>
        </div>

        <form id="artwork-form" class="admin-form">


            <label>
                Title
                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                >
            </label>

            <label>
                Year
                <input
                    type="number"
                    id="creation-year"
                    name="creation_year"
                    required
                >
            </label>

            <label>
                Description
                <textarea
                    id="description"
                    name="description"
                ></textarea>
            </label>

            <label>
                Height, sm
                <input
                    type="number"
                    step="0.1"
                    id="height"
                    name="height_cm"
                >
            </label>

            <label>
                Width, sm
                <input
                    type="number"
                    step="0.1"
                    id="width"
                    name="width_cm"
                >
            </label>

            <label>
                Medium
                <select id="medium" name="medium_id" class="js-artwork-select">
                    <option value="">Select medium</option>
                </select>
            </label>

            <label>
                Status
                <select id="status" name="status_id" class="js-artwork-select">
                    <option value="">Select status</option>
                </select>
            </label>

            <label>
                Surface
                <select id="surface" name="surface_id" class="js-artwork-select">
                    <option value="">Select surface</option>
                </select>
            </label>

            <label>
                Owner
                <select id="owner" name="owner_id" class="js-artwork-select">
                    <option value="">Select owner</option>
                </select>
            </label>

            <label class="checkbox-label">
                <input
                    type="checkbox"
                    id="is-featured"
                >
                Featured (main page)
            </label>

            <label class="checkbox-label">
                <input
                type="checkbox"
                id="is-copy"
                    name="is_copy"
                >
                Is a copy
            </label>

            <fieldset class="genres">
                <legend>Genres</legend>
                <div id="genres" class="genres-list"></div>
            </fieldset>

            <button type="submit" class="button">
                Save
            </button>

            <div id="form-message" class="form-message" hidden></div>

        </form>

        <section class="admin-images">

            <h2 class="subtitle">Images</h2>

            <div id="images-container" class="images-container">
                <!-- Dynamically rendered -->
            </div>

        </section>

        <section class="admin-image-upload">

            <h2 class="subtitle">Add image</h2>

            <form id="image-upload-form" class="img-upload-form">

                <label>
                    File

                    <input
                        type="file"
                        id="image-file"
                        accept="image/jpeg,image/png"
                        required
                    >
                </label>

                <label>
                    Image type

                    <select id="image-type">
                        <option value="main">
                            Main image
                        </option>

                        <option value="detail">
                            Detail
                        </option>
                    </select>
                </label>

                <button class="button" type="submit">
                    Save
                </button>

            </form>

        </section>

    </main>
</body>
</html>
