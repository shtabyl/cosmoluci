<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="styles/admin.css">
    <script type="module" src="scripts/auth.js" defer></script>

    <title>Вход в админку</title>

</head>


<body>

    <main>

        <h1 class="title">Вход в админку</h1>


        <form id="login-form">

            <div>

                <label for="username">
                    Логин
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div>

                <label for="password">
                    Пароль
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit" class="button">
                Войти
            </button>


            <div
                id="login-message"
                hidden
            ></div>

        </form>

    </main>

</body>

</html>
