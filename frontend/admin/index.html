                <div id="js-clear-search" class="clear-search" hidden>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4Z" stroke="#e0d9d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <g clip-path="url(#clip0_41_56)">

                        <path d="M15 9V15H9V9H15Z" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>

                        <g mask="url(#mask0_41_56)">

                        </g>

                        <rect width="8" height="8" fill="white" transform="translate(8 8)"></rect>
                        </clipPath>

                    </svg>
                </div>
            </div>
        </header>

        <div class="admin-list admin-row artwork-list-titles">
            <div class="artwork-list-title">ID</div>
            <div class="artwork-list-title">Image</div>
            <div class="artwork-list-title">Title</div>
            <div class="artwork-list-title">Year</div>
            <div class="artwork-list-title">Public</div>
            <div class="artwork-list-title">Best</div>
            <div class="artwork-list-title">Edit</div>
        </div>
        <section id="artworks-list" class="admin-list">
            <!-- картины будут добавлены через JS -->
        </section>

    </main>
