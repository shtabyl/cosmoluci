                    </div>
                    <div class="navbar__menu-list">
                        <ul>
                            <li class="navbar__menu-item link"><a href="gallery.html">Artworks</a></li>

                                </a>
                            </li>

                        </form>
                        -->

                <p id="painting-description" class="painting__description text"></p>
